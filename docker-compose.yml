services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentry_alert_bridge
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sentry_alert_bridge']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
      target: builder
    command: npm run dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '8000'
      DATABASE_URL: postgres://postgres:postgres@db:5432/sentry_alert_bridge
      VITE_API_TARGET: http://localhost:8000
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - .:/opt/app-root/src
      - node_modules:/opt/app-root/src/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  node_modules:
